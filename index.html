  const firebaseConfig = {
    apiKey: "AIzaSyA1DIpl0ZD-ox-SDRFmNPAsHdlYctEx4nA",
    authDomain: "wtf-fifa-2026.firebaseapp.com",
    projectId: "wtf-fifa-2026",
    storageBucket: "wtf-fifa-2026.firebasestorage.app",

    appId: "1:162163945307:web:010519882adecfbf0a747e",

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const COLORS = {
  navy: "#0B1B3E", navyDeep: "#071230", navyCard: "#111F45",
  gold: "#D4AF37", goldSoft: "#F0DFA0", chalk: "#FFFFFF", ink: "#12183A",
  inkSoft: "#8890B5", line: "#24305C", green: "#1F9D57", red: "#D9524A",
};

const FLAGS = {
  Germany: "🇩🇪", Paraguay: "🇵🇾", France: "🇫🇷", Sweden: "🇸🇪",
  "South Africa": "🇿🇦", Canada: "🇨🇦", Netherlands: "🇳🇱", Morocco: "🇲🇦",
  Portugal: "🇵🇹", Croatia: "🇭🇷", Spain: "🇪🇸", Austria: "🇦🇹",
  "United States": "🇺🇸", "Bosnia & Herzegovina": "🇧🇦", Belgium: "🇧🇪", Senegal: "🇸🇳",
  Brazil: "🇧🇷", Japan: "🇯🇵", "Ivory Coast": "🇨🇮", Norway: "🇳🇴",
  Mexico: "🇲🇽", Ecuador: "🇪🇨", England: "🏴", "DR Congo": "🇨🇩",
  Argentina: "🇦🇷", "Cape Verde": "🇨🇻", Australia: "🇦🇺", Egypt: "🇪🇬",
  Switzerland: "🇨🇭", Algeria: "🇩🇿", Colombia: "🇨🇴", Ghana: "🇬🇭",
};

const LEFT_PAIRS = [
  ["Germany", "Paraguay"], ["France", "Sweden"],
  ["South Africa", "Canada"], ["Netherlands", "Morocco"],
  ["Portugal", "Croatia"], ["Spain", "Austria"],
  ["United States", "Bosnia & Herzegovina"], ["Belgium", "Senegal"],
];
const RIGHT_PAIRS = [
  ["Brazil", "Japan"], ["Ivory Coast", "Norway"],
  ["Mexico", "Ecuador"], ["England", "DR Congo"],
  ["Argentina", "Cape Verde"], ["Australia", "Egypt"],
  ["Switzerland", "Algeria"], ["Colombia", "Ghana"],
];

const ROUND_LABELS = ["รอบ 32 ทีม", "รอบ 16 ทีม", "รอบ 8 ทีม", "รอบรองชนะเลิศ"];
const ROUND_WEIGHTS = [1, 2, 4, 8];
const FINAL_WEIGHT = 16;
const AVATAR_COLORS = ["#D4AF37", "#5DCAA5", "#D85A30", "#7F77DD", "#378ADD", "#D4537E"];
const THAI_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

// เวลาเตะ + สถานะ มาจาก Firestore (ตัว auto-updater ดึงจาก API มาให้)
// ค่า hardcode ด้านล่างเป็นแค่ fallback กรณียังไม่มีข้อมูลจาก API
const FIXTURES = {};

const tsOf = (iso) => new Date(iso).getTime();
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// สถานะแมทช์ — ยึดสถานะจาก API ก่อน ถ้าไม่มีค่อย fallback เป็นเวลา/ผู้ชนะ
function slotStatus(key, actual, sched, nowTs) {
  const iso = (sched.fixtures && sched.fixtures[key]) || FIXTURES[key] || null;
  const apiStatus = sched.statuses && sched.statuses[key];
  const winner = actual[key] || null;

  if (apiStatus) {
    if (apiStatus === "FINISHED" || apiStatus === "AWARDED") {
      if (winner) return { state: "finished", winner, iso };
      return { state: "live", winner: null, iso };
    }
    if (apiStatus === "IN_PLAY" || apiStatus === "PAUSED" || apiStatus === "SUSPENDED") {
      return { state: "live", winner: null, iso };
    }
    return { state: "upcoming", winner: null, iso }; // TIMED / SCHEDULED / POSTPONED
  }

  // fallback (ไม่มีข้อมูลจาก API สำหรับคู่นี้)
  if (winner) return { state: "finished", winner, iso };       // ผลที่กรอกมือ
  if (!iso) return { state: "upcoming", winner: null, iso };
  return tsOf(iso) <= nowTs ? { state: "live", winner: null, iso } : { state: "upcoming", winner: null, iso };
}

function advancer(key, pick, actual, sched, nowTs) {
  const st = slotStatus(key, actual, sched, nowTs);
  if (st.state === "finished") return st.winner;
  if (st.state === "live") return null;
  return pick[key] || null;
}
function buildRounds(pairs, side, pick, actual, sched, nowTs) {
  const rounds = [pairs.map(([t1, t2]) => ({ team1: t1, team2: t2 }))];
  for (let r = 0; r < 3; r++) {
    const prev = rounds[r]; const next = [];
    for (let i = 0; i < prev.length; i += 2) {
      next.push({
        team1: advancer(`${side}-${r}-${i}`, pick, actual, sched, nowTs),
        team2: advancer(`${side}-${r}-${i + 1}`, pick, actual, sched, nowTs),
      });
    }
    rounds.push(next);
  }
  return rounds;
}
function computeScore(pick, actual, sched, nowTs) {
  let score = 0, correct = 0, decided = 0;
  const grade = (key, w) => {
    const st = slotStatus(key, actual, sched, nowTs);
    if (st.state === "finished") { decided++; if (pick[key] && pick[key] === st.winner) { score += w; correct++; } }
  };
  ["left", "right"].forEach((side) => {
    for (let r = 0; r < 4; r++) { const c = 8 / Math.pow(2, r); for (let i = 0; i < c; i++) grade(`${side}-${r}-${i}`, ROUND_WEIGHTS[r]); }
  });
  grade("final", FINAL_WEIGHT);
  return { score, correct, decided };
}
function initials(n) { return (n || "?").trim().slice(0, 2).toUpperCase(); }
function avatarColor(n) { let h = 0; for (let i = 0; i < (n || "").length; i++) h = (h * 31 + n.charCodeAt(i)) % AVATAR_COLORS.length; return AVATAR_COLORS[h]; }
function slugify(n) { return n.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9\u0E00-\u0E7F-]/g, ""); }

function Avatar({ name, size = 34 }) {
  return <div style={{ width: size, height: size, borderRadius: "50%", background: avatarColor(name), color: COLORS.navyDeep, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Work Sans', sans-serif", fontWeight: 600, fontSize: size * 0.36, flexShrink: 0 }}>{initials(name)}</div>;
}

function TeamPill({ name, variant, wrong, dim, clickable, onClick }) {
  if (!name) return <div style={{ height: 38, borderRadius: 8, background: "rgba(255,255,255,0.04)", border: `1px dashed ${COLORS.line}`, display: "flex", alignItems: "center", padding: "0 12px", fontFamily: "'Work Sans', sans-serif", fontSize: 12.5, color: COLORS.inkSoft }}>รอทีมเข้ารอบ</div>;
  let bg = COLORS.chalk, fg = COLORS.ink, border = "transparent";
  if (variant === "result") { bg = COLORS.green; fg = COLORS.chalk; }
  else if (variant === "pick") { bg = COLORS.gold; fg = COLORS.ink; }
  return (
    <button onClick={clickable ? onClick : undefined} disabled={!clickable}
      style={{ height: 38, width: "100%", borderRadius: 8, background: bg, border: `1.5px solid ${wrong ? COLORS.red : border}`, display: "flex", alignItems: "center", gap: 9, padding: "0 12px", fontFamily: "'Work Sans', sans-serif", fontSize: 14, fontWeight: variant ? 600 : 500, color: fg, cursor: clickable ? "pointer" : "default", textAlign: "left", opacity: dim ? 0.45 : 1 }}>
      <span style={{ fontSize: 17 }}>{FLAGS[name] || "🏳️"}</span>
      <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{name}</span>
      {variant === "result" && <span style={{ fontSize: 13 }}>✓</span>}
      {wrong && <span style={{ fontSize: 13, color: COLORS.red }}>✗</span>}
    </button>
  );
}

function StatusLine({ st, mode, myPick }) {
  let icon, text, color;
  if (st.state === "finished") {
    icon = "🔒"; text = "จบแล้ว"; color = COLORS.inkSoft;
    if (mode !== "admin" && myPick) { const ok = myPick === st.winner; text += ok ? " · ทายถูก" : " · ทายพลาด"; color = ok ? COLORS.green : COLORS.red; }
    else if (mode !== "admin" && !myPick) { text += " · ไม่ได้ทาย"; }
  } else if (st.state === "live") { icon = "🔴"; text = "กำลังแข่ง · รอกรอกผล"; color = COLORS.red; }
  else { icon = "🕐"; text = st.iso ? fmtDate(st.iso) : "รอกำหนดการ"; color = COLORS.inkSoft; }
  return <div style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, color, marginTop: 2, display: "flex", alignItems: "center", gap: 5 }}><span style={{ fontSize: 10 }}>{icon}</span>{text}</div>;
}

function SlotMatch({ sideKey, team1, team2, pick, actual, sched, nowTs, mode, onPick }) {
  const st = slotStatus(sideKey, actual, sched, nowTs);
  const myPick = pick[sideKey] || null;
  const both = !!(team1 && team2);
  const props = (team) => {
    if (!team) return {};
    if (mode === "admin") return { variant: actual[sideKey] === team ? "pick" : undefined, clickable: both };
    if (st.state === "finished") {
      const win = st.winner === team; const wrongPick = myPick === team && !win;
      return { variant: win ? "result" : wrongPick ? "pick" : undefined, wrong: wrongPick, dim: !win && !wrongPick };
    }
    return { variant: myPick === team ? "pick" : undefined, clickable: mode === "predict" && st.state === "upcoming" && both };
  };
  const p1 = props(team1), p2 = props(team2);
  return (
    <div style={{ marginBottom: 12 }}>
      <TeamPill name={team1} {...p1} onClick={() => onPick(team1)} />
      <div style={{ height: 5 }} />
      <TeamPill name={team2} {...p2} onClick={() => onPick(team2)} />
      <StatusLine st={st} mode={mode} myPick={myPick} />
    </div>
  );
}

function BracketList({ pick, actual, sched, nowTs, mode, onSelect }) {
  const L = buildRounds(LEFT_PAIRS, "left", pick, actual, sched, nowTs);
  const R = buildRounds(RIGHT_PAIRS, "right", pick, actual, sched, nowTs);
  const lf = advancer("left-3-0", pick, actual, sched, nowTs);
  const rf = advancer("right-3-0", pick, actual, sched, nowTs);
  return (
    <div>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 12 }}>
        {[0, 1, 2, 3].map((r) => (
          <button key={r} onClick={() => document.getElementById(`sec-${r}`)?.scrollIntoView({ behavior: "smooth", block: "start" })}
            style={{ flexShrink: 0, fontSize: 12, fontWeight: 500, color: COLORS.goldSoft, background: "rgba(212,175,55,0.1)", border: `1px solid ${COLORS.line}`, borderRadius: 20, padding: "6px 12px", whiteSpace: "nowrap" }}>{ROUND_LABELS[r]}</button>
        ))}
        <button onClick={() => document.getElementById("sec-final")?.scrollIntoView({ behavior: "smooth", block: "start" })}
          style={{ flexShrink: 0, fontSize: 12, fontWeight: 600, color: COLORS.navyDeep, background: COLORS.gold, border: "none", borderRadius: 20, padding: "6px 12px", whiteSpace: "nowrap" }}>🏆 ชิงชนะเลิศ</button>
      </div>
      {[0, 1, 2, 3].map((r) => (
        <div key={r} id={`sec-${r}`} style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 14, fontWeight: 600, color: COLORS.chalk, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10, paddingTop: 4 }}>{ROUND_LABELS[r]}</div>
          <div style={{ display: "flex", gap: 14 }}>
            {["left", "right"].map((side) => {
              const rounds = side === "left" ? L : R;
              return (
                <div key={side} style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 10, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 }}>{side === "left" ? "สายซ้าย" : "สายขวา"}</div>
                  {rounds[r].map((m, i) => (
                    <SlotMatch key={i} sideKey={`${side}-${r}-${i}`} team1={m.team1} team2={m.team2} pick={pick} actual={actual} sched={sched} nowTs={nowTs} mode={mode} onPick={(t) => onSelect(side, r, i, t, false)} />
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      ))}
      <div id="sec-final" style={{ marginBottom: 8 }}>
        <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 14, fontWeight: 600, color: COLORS.gold, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10, paddingTop: 4 }}>🏆 รอบชิงชนะเลิศ</div>
        <SlotMatch sideKey="final" team1={lf} team2={rf} pick={pick} actual={actual} sched={sched} nowTs={nowTs} mode={mode} onPick={(t) => onSelect(null, null, null, t, true)} />
      </div>
    </div>
  );
}

function Legend() {
  const item = (color, label, isBorder) => (
    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
      <span style={{ width: 11, height: 11, borderRadius: 3, background: isBorder ? "transparent" : color, border: isBorder ? `1.5px solid ${color}` : "none" }} />
      <span style={{ fontSize: 10.5, color: COLORS.inkSoft }}>{label}</span>
    </div>
  );
  return (
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 14, padding: "8px 10px", background: COLORS.navyCard, borderRadius: 8, border: `1px solid ${COLORS.line}` }}>
      {item(COLORS.gold, "ที่คุณทาย")}{item(COLORS.green, "ผลจริง (ผ่านเข้ารอบ)")}{item(COLORS.red, "ทายพลาด", true)}
    </div>
  );
}

function Onboarding({ onSubmit, busy }) {
  const [name, setName] = useState("");
  return (
    <div style={{ minHeight: 460, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", padding: 24, textAlign: "center" }}>
      <div style={{ fontSize: 40, marginBottom: 10 }}>🏆</div>
      <h1 style={{ fontFamily: "'Oswald', sans-serif", fontSize: 22, fontWeight: 700, color: COLORS.chalk, margin: "0 0 6px", textTransform: "uppercase" }}>ทายผลบอลโลกกับเพื่อน</h1>
      <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: "0 0 20px", maxWidth: 280 }}>ตั้งชื่อเล่นก่อน เพื่อนจะเห็นชื่อนี้ตอนดูสายที่คุณทาย</p>
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="ชื่อเล่นของคุณ"
        style={{ width: "100%", maxWidth: 260, height: 42, borderRadius: 8, border: `1px solid ${COLORS.line}`, background: COLORS.navyCard, color: COLORS.chalk, padding: "0 14px", fontSize: 14, marginBottom: 12, boxSizing: "border-box" }} />
      <button onClick={() => name.trim() && onSubmit(name.trim())} disabled={!name.trim() || busy}
        style={{ width: "100%", maxWidth: 260, height: 42, borderRadius: 8, background: COLORS.gold, border: "none", color: COLORS.navyDeep, fontSize: 14, fontWeight: 600, cursor: "pointer", opacity: busy ? 0.6 : 1 }}>{busy ? "กำลังบันทึก…" : "เริ่มทายผล"}</button>
    </div>
  );
}

const LS_KEY = "wc2026_profile";

function App() {
  const [fbReady, setFbReady] = useState(false);
  const [fbError, setFbError] = useState("");
  const [profile, setProfile] = useState(null);
  const [selections, setSelections] = useState({});
  const [actual, setActual] = useState({});
  const [sched, setSched] = useState({ fixtures: {}, statuses: {} });
  const [players, setPlayers] = useState([]);
  const [tab, setTab] = useState("predict");
  const [viewingFriend, setViewingFriend] = useState(null);
  const [showActualEditor, setShowActualEditor] = useState(false);
  const [busy, setBusy] = useState(false);
  const [nowTs, setNowTs] = useState(Date.now());
  const [copied, setCopied] = useState(false);
  const [shareFallback, setShareFallback] = useState("");
  const hydrated = useRef(false);

  useEffect(() => {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) setProfile(JSON.parse(raw)); } catch (e) {}
    const onReady = () => {
      setFbReady(true);
      if (window.__fb && window.__fb.ok === false) setFbError(window.__fb.error || "ต่อ Firebase ไม่ได้");
      else if (window.__fb && window.__fb.authError) setFbError(window.__fb.authError);
    };
    if (window.__fb && window.__fb.ready) onReady();
    else window.addEventListener("fbready", onReady, { once: true });
  }, []);

  useEffect(() => {
    if (!fbReady || !window.__fb || window.__fb.ok === false) return;
    const unsubP = window.__fb.subPlayers((list) => {
      setPlayers(list);
      if (!hydrated.current) {
        const me = profile && list.find((p) => p.id === profile.id);
        if (me) { setSelections(me.selections || {}); }
        hydrated.current = true;
      }
    });
    const unsubA = window.__fb.subActual((data) => {
      setActual(data.selections || {});
      setSched({ fixtures: data.fixtures || {}, statuses: data.statuses || {} });
    });
    return () => { unsubP && unsubP(); unsubA && unsubA(); };
  }, [fbReady, profile]);

  useEffect(() => { const t = setInterval(() => setNowTs(Date.now()), 30000); return () => clearInterval(t); }, []);

  const createProfile = async (name) => {
    setBusy(true);
    const id = `${slugify(name)}-${Math.random().toString(36).slice(2, 6)}`;
    const p = { id, name };
    try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch (e) {}
    try { await window.__fb.setPlayer(id, { name, selections: {}, updatedAt: Date.now() }); } catch (e) {}
    setProfile(p);
    setBusy(false);
  };

  const applyPick = (setter, persist) => (side, roundIdx, matchIdx, team, isFinal) => {
    if (!team) return;
    setter((prev) => {
      const next = { ...prev };
      if (isFinal) next.final = team;
      else {
        next[`${side}-${roundIdx}-${matchIdx}`] = team;
        Object.keys(next).forEach((k) => { if (k.startsWith(`${side}-`)) { const r = parseInt(k.split("-")[1], 10); if (r > roundIdx) delete next[k]; } });
        delete next.final;
      }
      persist(next);
      return next;
    });
  };
  const selectWinner = applyPick(setSelections, (next) => {
    if (profile) window.__fb.setPlayer(profile.id, { name: profile.name, selections: next, updatedAt: Date.now() }).catch(() => {});
  });
  const selectActual = applyPick(setActual, (next) => {
    window.__fb.setActual({ selections: next, updatedAt: Date.now(), editedBy: profile?.name || "" }).catch(() => {});
  });

  const merged = {};
  players.forEach((p) => (merged[p.id] = p));
  if (profile) merged[profile.id] = { id: profile.id, name: profile.name, selections };
  const allPlayers = Object.values(merged);

  const leaderboard = allPlayers.map((f) => ({ ...f, ...computeScore(f.selections || {}, actual, sched, nowTs) }))
    .sort((a, b) => b.score - a.score || b.correct - a.correct);
  const myRank = profile ? leaderboard.findIndex((f) => f.id === profile.id) + 1 : 0;

  const buildShareText = () => {
    const rows = leaderboard.map((f, i) => `${i + 1}. ${f.name}${profile && f.id === profile.id ? " (คุณ)" : ""} — ${f.score} แต้ม (ถูก ${f.correct}/${f.decided})`);
    return `🏆 ทายผลบอลโลก 2026 — อันดับล่าสุด\n\n${rows.join("\n")}\n\nผู้เล่น ${allPlayers.length} คน · มาเล่นด้วยกัน:\n${location.href}`;
  };
  const doCopy = async () => {
    const text = buildShareText();
    try { await navigator.clipboard.writeText(text); setCopied(true); setShareFallback(""); setTimeout(() => setCopied(false), 2000); }
    catch (e) { setShareFallback(text); }
  };
  const doShare = async () => {
    const text = buildShareText();
    if (navigator.share) { try { await navigator.share({ title: "ทายผลบอลโลก 2026", text }); return; } catch (e) {} }
    doCopy();
  };

  const wrap = (children) => <div style={{ background: COLORS.navy, borderRadius: 16, maxWidth: 420, margin: "0 auto", minHeight: "100vh" }}>{children}</div>;

  if (!fbReady) return wrap(<div style={{ padding: 40, textAlign: "center", color: COLORS.inkSoft, fontSize: 13 }}>กำลังเชื่อมต่อ…</div>);
  if (fbError) return wrap(<div style={{ padding: 30, color: COLORS.chalk, fontSize: 13, lineHeight: 1.6 }}><div style={{ fontSize: 30, marginBottom: 10 }}>⚠️</div><b>เชื่อมต่อ Firebase ไม่ได้</b><br /><span style={{ color: COLORS.inkSoft }}>{fbError}</span></div>);
  if (!profile) return wrap(<Onboarding onSubmit={createProfile} busy={busy} />);

  return (
    <div style={{ background: COLORS.navy, borderRadius: 16, maxWidth: 420, margin: "0 auto", display: "flex", flexDirection: "column", minHeight: "100vh" }}>
      <div style={{ padding: "18px 18px 12px", borderBottom: `1px solid ${COLORS.line}`, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <Avatar name={profile.name} />
          <div>
            <div style={{ fontSize: 10, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.8, display: "flex", alignItems: "center", gap: 5 }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: COLORS.green, display: "inline-block" }} />สด
            </div>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 15, fontWeight: 600, color: COLORS.chalk }}>{profile.name}</div>
          </div>
        </div>
        <button onClick={() => setShowActualEditor(true)} style={{ fontSize: 11, fontWeight: 600, color: COLORS.goldSoft, background: "rgba(212,175,55,0.1)", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "8px 10px", cursor: "pointer" }}>⚙ กรอกผลจริง</button>
      </div>

      <div style={{ flex: 1, padding: "16px 18px 8px", overflowY: "auto" }}>
        {showActualEditor ? (
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
              <button onClick={() => setShowActualEditor(false)} style={{ background: "transparent", border: "none", color: COLORS.goldSoft, fontSize: 14, cursor: "pointer" }}>← กลับ</button>
              <div style={{ fontSize: 12, color: COLORS.inkSoft }}>กดทีมที่ชนะจริง (ปกติ auto-updater ทำให้เอง)</div>
            </div>
            <BracketList pick={actual} actual={actual} sched={sched} nowTs={nowTs} mode="admin" onSelect={selectActual} />
          </div>
        ) : tab === "predict" ? (
          viewingFriend ? (
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                <button onClick={() => setViewingFriend(null)} style={{ background: "transparent", border: "none", color: COLORS.goldSoft, fontSize: 14, cursor: "pointer" }}>← กลับ</button>
                <Avatar name={viewingFriend.name} size={24} />
                <div style={{ fontSize: 13, color: COLORS.chalk, fontWeight: 500 }}>สายของ {viewingFriend.name}</div>
              </div>
              <Legend />
              <BracketList pick={viewingFriend.selections || {}} actual={actual} sched={sched} nowTs={nowTs} mode="review" onSelect={() => {}} />
            </div>
          ) : (
            <div><Legend /><BracketList pick={selections} actual={actual} sched={sched} nowTs={nowTs} mode="predict" onSelect={selectWinner} /></div>
          )
        ) : tab === "friends" ? (
          <div>
            <div style={{ background: COLORS.navyCard, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "14px 16px", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <div>
                  <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 15, fontWeight: 600, color: COLORS.chalk }}>ชวนเพื่อนมาเล่น</div>
                  <div style={{ fontSize: 11, color: COLORS.inkSoft }}>ตอนนี้มีผู้เล่น {allPlayers.length} คน</div>
                </div>
                <div style={{ display: "flex", marginRight: 4 }}>
                  {allPlayers.slice(0, 4).map((f, i) => (<div key={f.id} style={{ marginLeft: i === 0 ? 0 : -8 }}><Avatar name={f.name} size={28} /></div>))}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={doShare} style={{ flex: 1, height: 38, borderRadius: 8, background: COLORS.gold, border: "none", color: COLORS.navyDeep, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>แชร์ลิงก์ + อันดับ</button>
                <button onClick={doCopy} style={{ flex: 1, height: 38, borderRadius: 8, background: "transparent", border: `1px solid ${COLORS.line}`, color: COLORS.goldSoft, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{copied ? "คัดลอกแล้ว ✓" : "คัดลอกข้อความ"}</button>
              </div>
              <div style={{ fontSize: 10.5, color: COLORS.inkSoft, marginTop: 10, lineHeight: 1.5 }}>เพื่อนเปิดลิงก์นี้ ตั้งชื่อเล่น แล้วจะโผล่มาในลิสต์อัตโนมัติ (ซิงค์สด)</div>
              {shareFallback && <textarea readOnly value={shareFallback} onFocus={(e) => e.target.select()} style={{ width: "100%", height: 110, marginTop: 10, borderRadius: 8, border: `1px solid ${COLORS.line}`, background: COLORS.navyDeep, color: COLORS.chalk, fontSize: 12, padding: 10, boxSizing: "border-box", resize: "none" }} />}
            </div>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 15, fontWeight: 600, color: COLORS.chalk, textTransform: "uppercase", marginBottom: 14 }}>ใครเล่นบ้าง</div>
            {allPlayers.map((f) => {
              const s = computeScore(f.selections || {}, actual, sched, nowTs);
              return (
                <button key={f.id} onClick={() => { setTab("predict"); setViewingFriend(f); }}
                  style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, background: COLORS.navyCard, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "12px 14px", marginBottom: 10, cursor: "pointer", textAlign: "left" }}>
                  <Avatar name={f.name} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 500, color: COLORS.chalk }}>{f.name} {profile && f.id === profile.id && <span style={{ color: COLORS.inkSoft, fontWeight: 400 }}>(คุณ)</span>}</div>
                    <div style={{ fontSize: 11, color: COLORS.inkSoft }}>ทายถูก {s.correct}/{s.decided} แมทช์ · {s.score} แต้ม</div>
                  </div>
                  <span style={{ color: COLORS.inkSoft, fontSize: 16 }}>›</span>
                </button>
              );
            })}
          </div>
        ) : (
          <div>
            <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 15, fontWeight: 600, color: COLORS.chalk, textTransform: "uppercase", marginBottom: 6 }}>อันดับความแม่น</div>
            <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 14 }}>คะแนนถ่วงน้ำหนักตามรอบ · คุณอยู่อันดับ {myRank || "-"} จาก {leaderboard.length}</div>
            {leaderboard.map((f, i) => (
              <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", marginBottom: 8, borderRadius: 10, background: COLORS.navyCard, border: profile && f.id === profile.id ? `1.5px solid ${COLORS.gold}` : `1px solid ${COLORS.line}` }}>
                <div style={{ width: 20, fontFamily: "'Oswald', sans-serif", fontSize: 14, fontWeight: 600, color: i === 0 ? COLORS.gold : COLORS.inkSoft, textAlign: "center" }}>{i + 1}</div>
                <Avatar name={f.name} size={30} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 500, color: COLORS.chalk }}>{f.name}{profile && f.id === profile.id && <span style={{ color: COLORS.inkSoft, fontWeight: 400 }}> (คุณ)</span>}</div>
                  <div style={{ fontSize: 10.5, color: COLORS.inkSoft }}>ถูก {f.correct}/{f.decided} แมทช์ที่ตัดสินแล้ว</div>
                </div>
                <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: 18, fontWeight: 700, color: COLORS.gold }}>{f.score}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {!showActualEditor && (
        <div style={{ display: "flex", borderTop: `1px solid ${COLORS.line}`, padding: "6px 6px calc(6px + env(safe-area-inset-bottom))", position: "sticky", bottom: 0, background: COLORS.navy }}>
          {[{ id: "predict", label: "ทายผล", icon: "⚽" }, { id: "friends", label: "เพื่อน", icon: "👥" }, { id: "leaderboard", label: "อันดับ", icon: "🏅" }].map((t) => (
            <button key={t.id} onClick={() => { setTab(t.id); setViewingFriend(null); }}
              style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, background: "transparent", border: "none", padding: "8px 0", cursor: "pointer", color: tab === t.id ? COLORS.gold : COLORS.inkSoft }}>
              <span style={{ fontSize: 17 }}>{t.icon}</span>
              <span style={{ fontSize: 10.5, fontWeight: tab === t.id ? 600 : 400 }}>{t.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
